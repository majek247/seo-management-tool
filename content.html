<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content · GrowUp</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#061d1c;--side:#051817;--panel:#0a2928;--panel2:#0d3331;--line:#14403e;--line2:#2c5d5a;--accent:#0e9f9c;--accent2:#2fd4b4;--text:#eaf6f3;--mute:#8db3ae;--amber:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
b{font-weight:700}small{color:var(--mute);font-size:11.5px}p{margin:0}
main{padding:18px 22px 40px;min-width:0}
.crumbs{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;gap:12px}.crumbs i{font-style:normal;margin:0 6px}.crumbs b{color:var(--text);font-weight:600}
.sync{display:flex;align-items:center;gap:14px}.sync span{display:flex;align-items:center;gap:6px}.sync span:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;font-weight:500}.ghost:hover{background:var(--line)}
.btn{background:var(--accent);border:0;border-radius:8px;padding:10px 16px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#12b3b0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:14px 0 16px}.head .a{display:flex;gap:10px}
h1{margin:0;font-size:clamp(30px,4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.025em}
.lead{margin-top:8px;font-size:15px;color:#c4dcd8}.lead i{font-style:normal;margin:0 6px;color:var(--mute)}.lead b{color:var(--text);font-weight:600}
.mt{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.mt button{background:none;border:0;padding:11px 22px;color:var(--mute);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.mt .on{background:#0e3b39;color:var(--text);border-bottom-color:var(--accent2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.eb{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--accent2);text-transform:uppercase}.eb.am{color:var(--amber)}
.mu{color:#b5d0cc}.mute{color:var(--mute)}
.link{background:none;border:0;color:var(--accent2);padding:0;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.strip{display:flex;align-items:center;gap:20px;padding:11px 16px;margin-bottom:12px;flex-wrap:wrap}.strip .eb{font-size:9.5px}.strip b{font-size:15px}.strip .link{margin-left:auto}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px;align-items:stretch}
.two h2{margin:6px 0 2px;font-size:20px;font-weight:800}.two h3{margin:4px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.two .big{font-size:23px;font-weight:700;margin:2px 0 6px}
.li{display:grid;grid-template-columns:34px 1fr 16px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.li:hover{background:#0d3230}.li svg{width:22px;height:22px}.li b{font-size:14px;font-weight:600;display:block}.li small{font-size:12px}
.foot{display:flex;align-items:center;gap:18px;margin-top:12px}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border-top:1px solid var(--line);padding-top:14px}.attrs div{display:flex;gap:8px;padding:0 10px;border-left:1px solid var(--line)}.attrs div:first-child{border:0;padding-left:0}.attrs svg{width:22px;height:22px;margin-top:2px;color:var(--mute)}.attrs small{display:block;font-size:11px}.attrs b{font-size:13.5px;font-weight:600}
.stats{display:grid;grid-template-columns:150px repeat(4,1fr);gap:0;padding:12px 16px;margin-bottom:12px;align-items:center}.stats>h2{margin:0;font-size:19px;font-weight:800}
.st{display:flex;gap:12px;align-items:center;padding:0 18px;border-left:1px solid var(--line)}.st svg{width:26px;height:26px;color:var(--text)}.st strong{font-size:22px;font-weight:700;margin-right:6px}.st small{display:block}.st b{font-size:13px}
.three{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.pt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pt h2{margin:0;font-size:19px;font-weight:800}
.sw{display:flex;background:#072322;border:1px solid var(--line);border-radius:8px;padding:2px}.sw button{background:none;border:0;padding:4px 10px;border-radius:6px;font-size:11.5px;color:var(--mute)}.sw .on{background:var(--accent);color:#fff;font-weight:600}
.tb{display:grid;grid-template-columns:2.1fr 1fr .6fr .9fr 20px;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}.tb.h{color:var(--mute);font-size:12px;border-top:0}.tb:not(.h){cursor:pointer}.tb:not(.h):hover{background:#0d3230}
.lib{grid-template-columns:2.2fr .9fr .6fr 1fr .6fr .8fr 20px}
.tt{display:flex;gap:10px;align-items:center;min-width:0}.tt svg{width:20px;height:20px;color:var(--mute)}.tt b{font-weight:600;font-size:12.5px;display:block}.tt small{font-size:11px}
.own{width:28px;height:28px;border-radius:50%;background:#12403d;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.sp{border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;background:#12403d;color:var(--mute);justify-self:start;white-space:nowrap}
.sp.brief_review{background:#5c4812;color:#ffd978}.sp.brief_ready,.sp.drafting{background:rgba(14,159,156,.28);color:#8ff0ec}.sp.editing,.sp.client_review{background:#16403e;color:#b5e8df}.sp.ready,.sp.live{background:#0f4a43;color:var(--accent2)}.sp.refresh{background:#5c4812;color:#ffd978}.sp.consolidate{background:rgba(14,159,156,.28);color:#8ff0ec}
.pg{display:grid;gap:12px}.pg .r{display:grid;grid-template-columns:30px auto 1fr;gap:0 12px;align-items:center}.pg svg.i{width:26px;height:26px;color:var(--text)}.pg strong{font-size:22px;font-weight:700}.pg small{display:block;font-size:11.5px}.pg b{font-size:13px}
.rop{display:flex;gap:12px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.rop svg{width:22px;height:22px;color:var(--amber)}.rop .eb{font-size:9px;color:var(--amber)}.rop b{display:block;font-size:14px}.rop p{font-size:11.5px;color:#b5d0cc}
.rf{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}.rf>div{flex:1}.rf p{color:#b5d0cc;margin:4px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.pgn{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px;padding:14px 6px 2px;border-top:1px solid var(--line)}
.pgn-l,.pgn-r{display:flex;align-items:center;gap:12px}
.pgn-m b{color:var(--text);font-weight:600}
.pgn .sw button{min-width:34px}
.pgn .ghost{padding:7px 12px;font-size:12.5px}
.pgn .ghost:disabled{opacity:.35;cursor:not-allowed;background:transparent}
.fine{margin-top:8px;color:var(--mute);font-size:11px}
input,select,textarea{background:#072322;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;display:block;margin-top:5px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:22px;width:min(560px,94vw)}dialog::backdrop{background:#000b}dialog h2{margin:0 0 4px;font-size:22px}
label{color:var(--mute);font-size:12px;font-weight:500;display:block;margin-top:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.s2{grid-column:span 2}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.acts span{display:flex;gap:8px}.fe{color:#ff9a8f;min-height:18px;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#5a1f1a;border:1px solid #a4443b;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.two,.three{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats>h2{grid-column:span 2;margin-bottom:8px}.st{border:0;padding:8px 0}.head{flex-direction:column}.tb .own,.tb .hd{display:none}.tb{grid-template-columns:2fr 1fr 20px}.attrs{grid-template-columns:1fr}.attrs div{border:0;padding:6px 0}}
</style></head>
<body><div id="root"></div><div id="toast"></div>
<dialog id="dlg"><form id="f"><h2 id="dt">New content</h2><div class="g2">
<label class="s2">Title<input name="title" required></label>
<label>Type<select name="type"><option>Comparison</option><option>Pricing</option><option>Product page</option><option>Industry</option><option>Integration</option><option>Guide</option><option>Solution</option></select></label>
<label>New page or update<select name="kind"><option value="new">New page</option><option value="update">Update</option></select></label>
<label>Stage<select name="stage"></select></label>
<label>Intent<select name="intent"><option>High</option><option>Medium</option><option>Low</option></select></label>
<label>Owner name<input name="owner_name" placeholder="Sarah Connor"></label>
<label>Publish target<input type="date" name="publish_target"></label>
<label class="s2">Summary<textarea name="summary" rows="2"></textarea></label>
<label>Refresh action<select name="refresh_action"><option value="">None</option><option value="refresh">Refresh</option><option value="consolidate">Consolidate</option></select></label>
<label>Refresh note<input name="refresh_note" placeholder="Weak demo conversion. Tighten proof and CTA."></label></div>
<p class="fe" id="fe"></p><div class="acts"><button type="button" class="ghost" id="del">Delete</button><span><button type="button" class="ghost" id="cn">Cancel</button><button class="btn">Save</button></span></div></form></dialog>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',bars:'<path d="M5 21V10M12 21V4M19 21v-8"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',ar:'<path d="M5 12h14M13 6l6 6-6 6"/>',cr:'<path d="M9 6l6 6-6 6"/>',cl:'<path d="M15 6l-6 6 6 6"/>',ne:'<path d="M7 17 17 7M8 7h9v9"/>',plus:'<path d="M12 5v14M5 12h14"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 1.8 4.5 4.5"/>',pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',rocket:'<path d="M5 19c0-3 1-4 3-5l-2-2c-1 0-2 .5-3 2zM14 5c3-2 6-2 7-2 0 1 0 4-2 7l-6 6-5-5z"/><circle cx="15" cy="9" r="1.5"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const SG={recommended:'Recommended',brief_review:'Brief review',brief_ready:'Brief ready',drafting:'Drafting',editing:'Editing',client_review:'Client review',ready:'Ready to publish',live:'Live'};
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';
const NUM=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];
$('#dlg').querySelector('[name=stage]').innerHTML=Object.entries(SG).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let S={cl:null,items:[],sp:null,tab:'prod',f:'all',q:'',edit:null,ps:10,pn:1};
const by=s=>S.items.filter(i=>i.stage==s),sub=i=>`${esc(i.type)} · ${i.kind=='update'?'Update':'New'}`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}

async function load(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#root').innerHTML='<main><div class="card empty">Sign in from the main app first, then reopen this tab.</div></main>';return}
 const c=(await sb.from('clients').select('*').order('created_at')).data||[];
 S.cl=c.find(x=>x.id==localStorage.cid)||c[0];
 if(!S.cl){$('#root').innerHTML='<main><div class="card empty">Create a client first.</div></main>';return}
 const[a,b]=await Promise.all([sb.from('content_items').select('*').eq('client_id',S.cl.id).order('publish_target',{nullsFirst:false}),sb.from('content_sprints').select('*').eq('client_id',S.cl.id).eq('active',true).limit(1)]);
 if(a.error){$('#root').innerHTML=`<main><div class="card empty">${esc(a.error.message)}<br>Run content_schema.sql in Supabase.</div></main>`;return}
 S.items=a.data;S.sp=b.data?.[0]||null;render()}

const trow=i=>`<div class="tb" data-i="${i.id}"><span class="tt">${ic('doc')}<span><b>${esc(i.title)}</b><small>${sub(i)}</small></span></span><span class="sp ${i.stage}">${SG[i.stage]}</span><span class="own">${esc(i.owner||'')}</span><span class="hd">${fmt(i.publish_target)}</span>${ic('cr')}</div>`;

function prod(){
 const br=by('brief_review'),nx=by('recommended')[0],live=by('live'),rf=live.find(i=>i.refresh_action),
 dm=live.reduce((a,i)=>a+(i.demos||0),0),op=live.reduce((a,i)=>a+(i.opps||0),0),
 mo=S.items.filter(i=>!['live','recommended'].includes(i.stage)).filter(i=>S.f=='all'||i.kind==S.f);
 const n=br.length,sp=S.sp;
 return`${sp?`<div class="card strip"><span class="eb">Current sprint</span><b>${esc(sp.name)}</b><small>${S.items.filter(i=>i.kind=='new'&&i.stage!='live').length} new pages · ${S.items.filter(i=>i.refresh_action).length} updates planned this month</small><button class="link" data-tab="lib">View sprint ${ic('ar')}</button></div>`:''}
 <div class="two"><div class="card"><div class="eb">Ready for client review</div>
 ${n?`<h3>${NUM[n]||n} brief${n>1?'s':''} ${n>1?'need':'needs'} a decision.</h3><p class="mu" style="margin-bottom:8px">Approve the angle and product claims before writing starts.</p>${br.slice(0,3).map(i=>`<div class="li" data-i="${i.id}">${ic('doc')}<span><b>${esc(i.title)}</b><small>${esc(i.type)} · ${esc(i.intent)} intent</small></span>${ic('cr')}</div>`).join('')}<div class="foot"><button class="btn" data-i="${br[0].id}">Review ${n} brief${n>1?'s':''} ${ic('ar')}</button><small>Client feedback keeps the first batch aligned.</small></div>`:`<h3>No briefs waiting.</h3><p class="mu">New briefs show up here when they need your decision.</p>`}</div>
 <div class="card"><div class="eb am">Next recommended page</div>${nx?`<div class="big" style="margin-top:12px">${esc(nx.title)}</div><p class="mu">${esc(nx.summary||'')}</p><div class="attrs"><div>${ic('bars')}<span><small>Strategy priority</small><b>${esc(nx.priority||'—')}</b></span></div><div>${ic('target')}<span><small>Buyer stage</small><b>${esc(nx.buyer_stage||'—')}</b></span></div><div>${ic('doc')}<span><small>Related page</small><b>${esc(nx.related_page||'—')}</b></span></div></div><button class="btn" data-brief="${nx.id}">Create brief ${ic('ar')}</button>`:`<p class="mu" style="margin-top:12px">Nothing recommended yet. Add a page with the Recommended stage.</p>`}</div></div>
 <div class="card stats"><h2>This month’s delivery</h2>
 <div class="st">${ic('doc')}<div><strong>${by('brief_ready').length}</strong><b>Briefs</b><small>Ready for writing</small></div></div>
 <div class="st">${ic('pen')}<div><strong>${by('drafting').length}</strong><b>Drafting</b><small>In progress</small></div></div>
 <div class="st">${ic('users')}<div><strong>${by('brief_review').length+by('client_review').length}</strong><b>Client review</b><small>With your team</small></div></div>
 <div class="st">${ic('rocket')}<div><strong>${live.length}</strong><b>Live</b><small>Published this month</small></div></div></div>
 <div class="three"><div class="card"><div class="pt"><h2>Pages in motion</h2><span style="display:flex;gap:10px;align-items:center"><div class="sw">${[['all','All'],['new','New pages'],['update','Updates']].map(([k,v])=>`<button data-f="${k}" class="${S.f==k?'on':''}">${v}</button>`).join('')}</div><span class="mute">${ic('search')}</span></span></div>
 <div class="tb h"><span>Page</span><span>Stage</span><span class="hd"></span><span class="hd">Publish target</span><span></span></div>${mo.map(trow).join('')||'<div class="empty">Nothing in motion.</div>'}</div>
 <div class="card"><div class="pt"><h2>What published pages are doing</h2><small>Last 30 days</small></div><div class="pg">
 <div class="r">${ic('bars')}<strong>${live.length}</strong><span><b>pages live</b><small>Published and attracting visits</small></span></div>
 <div class="r">${ic('users')}<strong>${dm}</strong><span><b>assisted demo requests</b><small>From content published this month</small></span></div>
 <div class="r">${ic('target')}<strong>${op}</strong><span><b>opportunities influenced</b><small>Where content was a touchpoint</small></span></div></div>
 ${rf?`<div class="rop">${ic('bulb')}<div><span class="eb">Refresh opportunity</span><b>${esc(rf.title)}</b><p>${esc(rf.refresh_note||'')}</p><button class="link" data-tab="ref" style="margin-top:6px">Open page review ${ic('ar')}</button></div></div>`:''}</div></div>
 <p class="fine">Production statuses and outcomes are tracked separately.</p>`}

function lib(){
 const q=S.q.toLowerCase(),all=S.items.filter(i=>!q||(i.title+i.type).toLowerCase().includes(q)),tp=Math.max(1,Math.ceil(all.length/S.ps));if(S.pn>tp)S.pn=tp;const st=(S.pn-1)*S.ps,r=all.slice(st,st+S.ps);
 return`<div class="card"><div class="pt"><h2>Content Library</h2><input id="q" placeholder="Search pages" value="${esc(S.q)}" style="max-width:240px;margin:0"></div>
 <div class="tb lib h"><span>Page</span><span>Type</span><span>Intent</span><span>Stage</span><span class="hd">Owner</span><span class="hd">Date</span><span></span></div>
 ${r.map(i=>`<div class="tb lib" data-i="${i.id}"><span class="tt">${ic('doc')}<span><b>${esc(i.title)}</b><small>${i.kind=='update'?'Update':'New'}</small></span></span><span>${esc(i.type)}</span><span>${esc(i.intent||'')}</span><span class="sp ${i.stage}">${SG[i.stage]}</span><span class="own hd">${esc(i.owner||'')}</span><span class="hd">${fmt(i.stage=='live'?i.published_at:i.publish_target)}</span>${ic('cr')}</div>`).join('')||'<div class="empty">No pages match.</div>'}${all.length?`<div class="pgn"><div class="pgn-l"><small>Rows per page</small><div class="sw">${[10,25,50].map(n=>`<button data-ps="${n}" class="${S.ps==n?'on':''}">${n}</button>`).join('')}</div></div><small class="pgn-m">Showing <b>${st+1}–${st+r.length}</b> of <b>${all.length}</b></small><div class="pgn-r"><button class="ghost" data-pn="prev" ${S.pn<=1?'disabled':''}>${ic('cl')} Previous</button><small>Page ${S.pn} of ${tp}</small><button class="ghost" data-pn="next" ${S.pn>=tp?'disabled':''}>Next ${ic('cr')}</button></div></div>`:''}</div>`}

function ref(){
 const r=S.items.filter(i=>i.refresh_action);
 return`<div class="card"><div class="pt"><h2>Refresh &amp; Consolidate</h2><small>${r.length} page${r.length==1?'':'s'} flagged</small></div><p class="mu">Pages that earn impressions but under-convert, or compete with each other. Flag a page from its edit panel.</p>
 ${r.map(i=>`<div class="rf">${ic('doc')}<div><b>${esc(i.title)}</b> <span class="sp ${i.refresh_action}" style="margin-left:6px">${i.refresh_action=='refresh'?'Refresh':'Consolidate'}</span><p>${esc(i.refresh_note||'No note yet.')}</p></div><button class="ghost" data-i="${i.id}">Open</button><button class="ghost" data-rd="${i.id}">Mark done</button></div>`).join('')||'<div class="empty">Nothing flagged for refresh.</div>'}</div>`}

function render(){
 const cl=S.cl,T=[['prod','Production'],['lib','Content Library'],['ref','Refresh & Consolidate']];
 $('#root').innerHTML=`<main><div class="crumbs"><span>Clients<i>/</i>${esc(cl.name)}<i>/</i><b>Content</b></span><span class="sync"><span>GA4 · Search Console · HubSpot</span><span>Synced 2h ago</span><button class="ghost" id="cv">Client view ${ic('ne')}</button></span></div>
 <div class="head"><div><h1>Turn buyer intent into live pages.</h1><p class="lead">${S.sp?`<b>${esc(S.sp.phase||'Roll out')}</b><i>•</i>${esc(S.sp.days_label||'Days 31–60')}<i>•</i>`:''}Build the pages that help buyers choose you.</p></div><div class="a"><button class="btn" id="add">New content ${ic('plus')}</button><button class="ghost" id="imp">Import pages</button></div></div>
 <div class="mt">${T.map(([k,v])=>`<button data-tab="${k}" class="${S.tab==k?'on':''}">${v}</button>`).join('')}</div>${{prod,lib,ref}[S.tab]()}</main>`;
 const q=$('#q');if(q){q.oninput=e=>{S.q=e.target.value;S.pn=1;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}}

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab],[data-i],[data-f],[data-ps],[data-pn],[data-brief],[data-rd],#add,#imp,#cv');if(!t||!$('#root').contains(t))return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;render()}
 else if(d.f){S.f=d.f;render()}
 else if(d.ps){S.ps=+d.ps;S.pn=1;render()}
 else if(d.pn){S.pn+=d.pn=='next'?1:-1;render()}
 else if(d.brief)upd(d.brief,{stage:'brief_review'})
 else if(d.rd)upd(d.rd,{refresh_action:null,refresh_note:null})
 else if(t.id=='add')openItem()
 else if(t.id=='imp')toast('Import is not set up yet')
 else if(t.id=='cv')toast('Client view is not set up for Content yet')
 else if(d.i)openItem(d.i)});
async function upd(id,v){const{error}=await sb.from('content_items').update(v).eq('id',id);error?toast(error.message):load()}

const FN=['title','type','kind','stage','intent','owner_name','publish_target','summary','refresh_action','refresh_note'];
function openItem(id){const f=$('#f').elements,i=id&&S.items.find(x=>x.id==id);S.edit=id||null;
 $('#dt').textContent=i?'Edit content':'New content';$('#del').style.display=i?'':'none';$('#fe').textContent='';
 FN.forEach(k=>f[k].value=i?i[k]??'':(k=='stage'?'brief_review':k=='kind'?'new':k=='type'?'Comparison':k=='intent'?'High':''));$('#dlg').showModal()}
$('#cn').onclick=()=>$('#dlg').close();
$('#del').onclick=async()=>{if(!confirm('Delete this page?'))return;const{error}=await sb.from('content_items').delete().eq('id',S.edit);if(error)$('#fe').textContent=error.message;else{$('#dlg').close();load()}};
$('#f').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,v={};
 FN.forEach(k=>v[k]=f[k].value.trim()||null);v.title=f.title.value.trim();
 const w=(v.owner_name||'').split(/\s+/).filter(Boolean);v.owner=w.length>1?(w[0][0]+w[1][0]).toUpperCase():(w[0]||'').slice(0,2).toUpperCase()||null;
 if(v.stage=='live'&&!(S.items.find(x=>x.id==S.edit)||{}).published_at)v.published_at=new Date().toISOString().slice(0,10);
 if(v.kind=='update'&&!v.refresh_action)v.refresh_action='refresh';if(!S.edit)v.client_id=S.cl.id;
 const{error}=await(S.edit?sb.from('content_items').update(v).eq('id',S.edit):sb.from('content_items').insert(v));
 if(error)$('#fe').textContent=error.message;else{$('#dlg').close();load()}};
addEventListener('storage',e=>e.key=='cid'&&load());
load();
</script></body></html>
